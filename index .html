<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf2e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<title>Методика — інтерактивний навігатор</title>
<style>
:root {
  --forest: #173f2d;
  --forest-deep: #102e22;
  --glass: rgba(250, 255, 250, .62);
  --glass-hover: rgba(255, 255, 255, .82);
  --edge: rgba(30, 91, 61, .35);
  --shadow: 0 12px 34px rgba(17, 58, 38, .14);
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--forest-deep);
  font-family: "Aptos", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #edf4ed;
}
.page {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  overflow: hidden;
  padding: clamp(20px, 4vw, 46px) 24px 34px;
  background-image: url("https://github.com/a64151368-dot/Metodic/blob/main/1atyas.png?raw=true");
  background-position: center center;
  background-size: cover;
  background-attachment: fixed;
}
.page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: transparent;
  pointer-events: none;
}
.header { text-align: center; position: relative; z-index: 2; }
.eyebrow {
  margin: 0 0 7px;
  color: #37674a;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .19em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  color: #173e2c;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2rem, 4vw, 3.3rem);
  line-height: 1.08;
  font-weight: 700;
  text-shadow: 0 2px 16px rgba(255,255,255,.55);
}
.subtitle {
  max-width: 680px;
  margin: 12px auto 0;
  color: #315640;
  font-size: clamp(.92rem, 1.35vw, 1.06rem);
  line-height: 1.55;
}
.dashboard {
  position: relative;
  width: min(1180px, 100%);
  height: min(790px, 82vh);
  min-height: 680px;
  margin: 12px auto 0;
}
.bubble {
  position: absolute;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  width: clamp(155px, 17vw, 205px);
  aspect-ratio: 1 / 1;
  min-height: 0;
  padding: 20px;
  border: 1.5px solid rgba(255,255,255,.96);
  border-radius: 50%;
  background:
    radial-gradient(circle at 28% 20%, rgba(255,255,255,.66) 0 4%, transparent 21%),
    radial-gradient(circle at 72% 78%, rgba(255,255,255,.08) 0 18%, transparent 47%),
    conic-gradient(from 15deg,
      rgba(255,178,218,.28),
      rgba(177,220,255,.26),
      rgba(190,255,223,.28),
      rgba(255,245,174,.27),
      rgba(213,190,255,.30),
      rgba(255,178,218,.28));
  box-shadow:
    inset 0 0 0 1px rgba(91,130,118,.28),
    inset 7px 7px 13px rgba(255,255,255,.62),
    inset -7px -8px 16px rgba(74,112,131,.16),
    0 5px 16px rgba(14,48,34,.22),
    0 0 0 1px rgba(255,255,255,.45);
  backdrop-filter: blur(1.5px) saturate(145%);
  -webkit-backdrop-filter: blur(1.5px) saturate(145%);
  color: #153f2c;
  text-decoration: none;
  text-align: center;
  font-family: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  font-size: clamp(1.35rem, 1.9vw, 1.85rem);
  line-height: 1.02;
  font-weight: 700;
  overflow-wrap: normal;
  word-break: normal;
  hyphens: none;
  text-wrap: balance;
  letter-spacing: .015em;
  color: #102f22;
  text-shadow:
    0 1px 0 rgba(255,255,255,1),
    0 0 3px rgba(255,255,255,1),
    0 1px 8px rgba(255,255,255,.96);
  transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
  overflow: hidden;
}
.bubble::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.88);
  box-shadow: inset 0 0 0 1px rgba(77,118,100,.16);
  background: linear-gradient(145deg, rgba(255,255,255,.30), transparent 36%, rgba(255,255,255,.08) 68%, rgba(255,255,255,.24));
  pointer-events: none;
}
.bubble::after {
  content: "";
  position: absolute;
  width: 26%;
  height: 12%;
  top: 13%;
  left: 19%;
  border-radius: 50%;
  background: rgba(255,255,255,.72);
  filter: blur(2px);
  transform: rotate(-35deg);
  pointer-events: none;
}
.bubble:hover, .bubble:focus-visible {
  z-index: 5;
  filter: saturate(1.28) brightness(1.035);
  box-shadow:
    inset 7px 7px 14px rgba(255,255,255,.62),
    inset -7px -8px 16px rgba(107,151,170,.15),
    0 15px 34px rgba(28,73,58,.20);
  transform: translateY(-5px) scale(1.045);
  outline: none;
}
.bubble:focus-visible { outline: 3px solid rgba(47,111,73,.35); outline-offset: 4px; }
.bubble .dot { display: none; }
.bubble-label {
  position: relative;
  z-index: 1;
  display: block;
  max-width: 100%;
  min-width: 0;
  overflow-wrap: normal;
  word-break: normal;
  hyphens: none;
  text-wrap: balance;
  color: #102f22;
  -webkit-text-fill-color: #102f22;
  text-shadow:
    0 1px 0 rgba(255,255,255,1),
    0 0 5px rgba(255,255,255,.98),
    0 0 10px rgba(255,248,220,.82);
  animation: fairy-shimmer 7s ease-in-out infinite;
}
@keyframes fairy-shimmer {
  0%, 100% { text-shadow: 0 1px 0 rgba(255,255,255,1), 0 0 4px rgba(255,255,255,.95), 0 0 7px rgba(255,248,220,.45); }
  50% { text-shadow: 0 1px 0 rgba(255,255,255,1), 0 0 5px rgba(255,255,255,1), 0 0 11px rgba(255,239,185,.72); }
}
.b1 { left: 3%; top: calc(8% + 1.2cm); }
.b2 { left: 1%; top: calc(37% + 1.2cm); }
.b3 { left: 6%; bottom: calc(7% - 1.2cm); }
.b4 { left: 29%; top: 1%; }
.b5 { left: 50%; bottom: -5%; transform: translateX(-50%); }
.b6 { right: 3%; top: calc(8% + 1.2cm); }
.b7 { right: 1%; top: calc(37% + 1.2cm); }
.b8 { right: 6%; bottom: calc(7% - 1.2cm); }
.b9 { right: 29%; top: 1%; }
.b5:hover, .b5:focus-visible { transform: translateX(-50%) translateY(-5px) scale(1.045); }
@media (max-width: 900px) {
  .page { padding: 16px 12px 28px; background-attachment: scroll; }
  .dashboard {
    width: min(720px, 100%);
    height: auto;
    min-height: 0;
    margin: 16px auto 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    justify-items: center;
    align-items: center;
    gap: clamp(12px, 2.5vw, 24px);
  }
  .bubble {
    position: relative;
    inset: auto !important;
    left: auto !important;
    right: auto !important;
    bottom: auto !important;
    top: auto !important;
    transform: none !important;
    width: min(100%, 205px);
    padding: clamp(14px, 2vw, 22px);
    font-size: clamp(1.15rem, 2vw, 1.45rem);
  }
  .b5 { grid-column: 2; }
  .bubble:hover, .bubble:focus-visible { transform: translateY(-4px) scale(1.025) !important; }
}
@media (max-width: 560px) {
  .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .bubble { width: min(100%, 180px); padding: 11px; font-size: clamp(1rem, 3.2vw, 1.2rem); line-height: 1.02; }
  .b5 { grid-column: 1 / -1; justify-self: center; }
  .bubble-label { animation-duration: 8s; }
}
@media (max-width: 360px) {
  .dashboard { gap: 9px; }
  .bubble { width: min(100%, 150px); padding: 8px; font-size: clamp(.92rem, 3.8vw, 1.05rem); line-height: 1; }
}
/* Фото в центрі сердечка на фоновому зображенні */
.heart-photo{position:absolute;z-index:1;left:50%;top:50%;width:300px;height:300px;margin:0;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;object-position:100% 38%;
  border:5px solid #fff;box-shadow:0 0 0 3px rgba(244,181,203,.95),0 14px 34px -12px rgba(17,58,38,.45);background:#f3f8f2;pointer-events:none}
.heart-photo[hidden]{display:none}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<main class="page">
<img class="heart-photo" id="heartPhoto" src="https://raw.githubusercontent.com/a64151368-dot/Metodic/main/495587467_9514934991958062_4755892174457678424_n.jpg" alt="Учасниці тренінгу працюють разом у колі" decoding="async">
<nav class="dashboard" aria-label="Категорії методичних ресурсів">
    <a class="bubble b1" href="https://a64151368-dot.github.io/Online-whiteboard/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Віртуальні дошки</span></a>
    <a class="bubble b2" href="https://a64151368-dot.github.io/Smart-Boards/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Smart Boards: інтерактивні полотна</span></a>
    <a class="bubble b3" href="https://a64151368-dot.github.io/Publication/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Фахові видання, збірники, ППД</span></a>
    <a class="bubble b4" href="https://a64151368-dot.github.io/SYP/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Подолання освітніх втрат</span></a>
    <a class="bubble b5" href="https://a64151368-dot.github.io/Test/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Padlet Arcade: ігрові тренажери</span></a>
    <a class="bubble b6" href="https://a64151368-dot.github.io/My-sites/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Сайти-навігатори</span></a>
    <a class="bubble b7" href="https://a64151368-dot.github.io/Interactive-exercises/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Інтерактивні вправи</span></a>
    <a class="bubble b8" href="https://a64151368-dot.github.io/Presentation/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Презентації</span></a>
    <a class="bubble b9" href="https://a64151368-dot.github.io/intellect/" target="_blank" rel="noopener noreferrer"><span class="dot"></span><span class="bubble-label">Ментальна карта</span></a>
</nav>
</main>
<script>
/* Ставить кружечок із фото точно в центр сердечка на фоні і робить його якомога більшим, не заходячи на бульбашки-написи */
(function(){
  var IMG_W=1672, IMG_H=940, HX=852, HY=490, HEART_R=170;
  var photo=document.getElementById('heartPhoto'), page=document.querySelector('.page');
  if(!photo||!page) return;
  function place(){
    var fixed=getComputedStyle(page).backgroundAttachment==='fixed';
    var pr=page.getBoundingClientRect();
    var cw=fixed?window.innerWidth:pr.width, ch=fixed?window.innerHeight:pr.height;
    var sc=Math.max(cw/IMG_W, ch/IMG_H);
    var cx=(cw-IMG_W*sc)/2+HX*sc, cy=(ch-IMG_H*sc)/2+HY*sc;
    if(fixed){cx-=pr.left; cy-=pr.top;}
    var r=HEART_R*sc;
    var bubbles=document.querySelectorAll('.bubble');
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i].getBoundingClientRect();
      var bx=b.left+b.width/2-pr.left, by=b.top+b.height/2-pr.top, br=b.width/2;
      var d=Math.hypot(cx-bx, cy-by)-br-10;
      if(d<r) r=d;
    }
    if(r<55){photo.hidden=true;return;}
    photo.hidden=false;
    photo.style.width=photo.style.height=(2*r)+'px';
    photo.style.left=cx+'px'; photo.style.top=cy+'px';
  }
  if(document.readyState!=='loading') place(); else document.addEventListener('DOMContentLoaded',place);
  window.addEventListener('load',place);
  window.addEventListener('resize',place);
  window.addEventListener('scroll',place,{passive:true});
})();
</script>
</body>
